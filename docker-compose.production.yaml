services:
  server:
    image: luminainc/server:1.20.1
    platform: linux/amd64
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
      - docling-service
    env_file:
      - .env
    environment:
      - OCR_PROVIDER=docling
      - DOCLING_SERVICE_URL=http://docling-service:8000
    deploy:
      replicas: 2
    restart: always
    volumes:
      - ./models.yaml:/app/models.yaml:ro

  task:
    image: luminainc/task:1.20.1
    platform: linux/amd64
    depends_on:
      - postgres
      - redis
      - minio
      - qdrant
      - docling-service
    env_file:
      - .env
    environment:
      - OCR_PROVIDER=docling
      - DOCLING_SERVICE_URL=http://docling-service:8000
    deploy:
      replicas: 5
    restart: always
    volumes:
      - ./models.yaml:/app/models.yaml:ro

  # deal-worker:
  #   image: luminainc/deal_document_worker:1.20.1
  #   platform: linux/amd64
  #   depends_on:
  #     - postgres
  #     - redis
  #     - minio
  #   env_file:
  #     - .env
  #   environment:
  #     - OCR_PROVIDER=azure
  #     - AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT=${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT}
  #     - AZURE_DOCUMENT_INTELLIGENCE_KEY=${AZURE_DOCUMENT_INTELLIGENCE_KEY}
  #   deploy:
  #     replicas: 2
  #   restart: always
  # NOTE: For local dev, run the worker via ./scripts/run-deal-worker-local.sh
  # For production, uncomment the service above and build the image first

  web:
    image: luminainc/web:1.20.1
    platform: linux/amd64
    ports:
      - "5173:8000"
    env_file:
      - .env
    deploy:
      replicas: 1
    restart: always

  # NEW: Docling OCR service (replaces 18.5GB GPU backends with 200MB service)
  docling-service:
    build: ./services/docling-service
    image: orin-docling:latest
    platform: linux/amd64
    ports:
      - "8002:8000"
    environment:
      - DOCLING_OCR_ENABLED=true
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 1G
    restart: always

  # REMOVED: Old GPU-based services (18.5GB saved!)
  # segmentation-backend and ocr-backend have been replaced by Docling
  # Docling provides superior document understanding with table extraction

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
    restart: always

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
    restart: always

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
        /usr/bin/mc mb myminio/chunkr --ignore-existing &&
        /usr/bin/mc anonymous set public myminio/chunkr
      "

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: always

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_PROXY=edge
      - KC_DB=postgres
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_ENABLED=true
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres
      - KC_HEALTH_ENABLED=true
      - KC_TRANSACTION_XA_ENABLED=false
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    command: [ "start-dev", "--import-realm" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:

